<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stationery Hub — Orders Admin</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 30px 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        /* Синяя шапка */
        .header-banner {
            background: linear-gradient(135deg, #006458, #2c8278);
            border-radius: 16px;
            padding: 25px 35px;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header-logo {
            background: white;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            overflow: hidden;
            flex-shrink: 0;
        }
        .header-logo img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }
        .header-text h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header-text p {
            margin: 4px 0 0 0;
            font-size: 14px;
            color: #d0e1fd;
            font-weight: 400;
        }
        /* Блок пользователя */
        .user-bar {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: normal;
        }

        /* Заголовок страницы */
        .title-orders {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #1e3c72;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Карточка с таблицей */
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 25px;
            border: 1px solid #e1e8ed;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px 12px;
            text-align: left;
            border-bottom: 1px solid #eef2f5;
        }
        th {
            color: #7f8c8d;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
        }
        .order-num {
            font-weight: bold;
            color: #1e3c72;
            font-size: 16px;
        }
        .user-id {
            color: #555;
            font-size: 15px;
        }
        .items-list {
            margin: 0;
            padding-left: 18px;
            color: #444;
            font-size: 14px;
        }
        .items-list li {
            margin-bottom: 4px;
        }
        .btn-complete {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-complete:hover {
            background-color: #218838;
        }
        .empty-msg {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Шапка -->
    <div class="header-banner">
        <div class="header-logo">
            <img src="https://img.hhcdn.ru/employer-logo-round/3561512.jpeg" alt="AITU Logo" onerror="this.src='https://via.placeholder.com/50'">
        </div>
        <div class="header-text">
            <h1>StationeryHub</h1>
            <p>Connected to the Cloudservice SupaBase</p>
        </div>
    </div>

    <!-- Инфо о вошедшем админе -->
    <div class="user-bar" id="userInfoContainer">
        <span>👤 Alikhan (ID: 18)</span>
        <button class="btn-logout" onclick="logout()">Выйти</button>
    </div>

    <!-- Раздел заказов -->
    <div class="title-orders">Orders</div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Order Num</th>
                    <th>User ID</th>
                    <th>Товары</th>
                    <th style="text-align: right;">Action</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                <tr>
                    <td colspan="4" class="empty-msg">Загрузка реальных заказов из базы...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000/api";

    function updateUserUI() {
        const userId = localStorage.getItem("currentUserId") || "18";
        const userName = localStorage.getItem("currentUserName") || "Alikhan";
        const userContainer = document.getElementById("userInfoContainer");

        if (userContainer) {
            userContainer.innerHTML = `
                <span>👤 ${userName} (ID: ${userId})</span>
                <button class="btn-logout" onclick="logout()">Выйти</button>
            `;
        }
    }

    function logout() {
        localStorage.removeItem("currentUserId");
        localStorage.removeItem("currentUserName");
        localStorage.removeItem("userRole");
        window.location.href = "index.html";
    }

    // Загрузка настоящих заказов с бэкенда
    async function loadAdminOrders() {
        const tbody = document.getElementById("ordersTableBody");
        try {
            const response = await fetch(`${API_URL}/orders`);
            if (!response.ok) throw new Error("Ошибка загрузки заказов с сервера");
            
            const orders = await response.json();
            
            // Фильтруем: показываем только те заказы, которые еще не доставлены/не завершены
            const activeOrders = orders.filter(o => o.status !== "Delivered" && o.status !== "completed");

            if (activeOrders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">Активных заказов нет 🎉</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            activeOrders.forEach(order => {
                const tr = document.createElement("tr");
                
                // Формируем список купленных товаров из базы
                let itemsHtml = "<ul class='items-list'>";
                if (order.items && order.items.length > 0) {
                    order.items.forEach(item => {
                        // Подтягиваем название товара и его количество
                        const name = item.product_name || item.name || `Товар #${item.product_id || item.id}`;
                        const qty = item.quantity || 1;
                        itemsHtml += `<li>${name}: ${qty} шт.</li>`;
                    });
                } else {
                    itemsHtml += "<li>Товары не указаны</li>";
                }
                itemsHtml += "</ul>";

                tr.innerHTML = `
                    <td class="order-num">#${order.id}</td>
                    <td class="user-id">${order.user_id}</td>
                    <td>${itemsHtml}</td>
                    <td style="text-align: right;">
                        <button class="btn-complete" onclick="completeOrder(${order.id}, this)">
                            ✓ Завершить
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="4" class="empty-msg" style="color: red;">Не удалось загрузить данные с сервера. Проверьте запущен ли бэкенд!</td></tr>`;
        }
    }

    // Отправка запроса на завершение заказа в базу
    async function completeOrder(orderId, buttonEl) {
        try {
            const response = await fetch(`${API_URL}/orders/${orderId}/status`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: "Delivered" })
            });

            if (response.ok) {
                const row = buttonEl.closest("tr");
                row.style.transition = "all 0.3s";
                row.style.opacity = "0";
                setTimeout(() => {
                    row.remove();
                    const tbody = document.getElementById("ordersTableBody");
                    if (tbody.children.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">Активных заказов нет 🎉</td></tr>`;
                    }
                }, 300);
            } else {
                alert("Не удалось обновить статус заказа в базе");
            }
        } catch (err) {
            console.error(err);
            alert("Ошибка сети при обращении к серверу");
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateUserUI();
        loadAdminOrders();
    });
</script>

</body>
</html>
