<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StationaryHub — Каталог</title>
    <link rel="stylesheet" href="script.css">
</head>
<body>

<div class="container">
    
    <div class="header">
    <img src="https://img.hhcdn.ru/employer-logo-round/3561512.jpeg" alt="AITU Logo" class="aitu-logo" height="100">
    
    <h1>StationaryHub</h1>
    <p>Connected to the Cloudservice SupaBase</p> 
</div>
</div>

  
    <div class="card">
        <h2>1. Каталог товаров (Чтение из базы и фильтрация)</h2>
        
        <div class="filter-group">
            <label for="productFilter">Выберите товар для отображения:</label>
            <select id="productFilter" onchange="filterProducts()">
                <option value="all">Все товары (Показать всё)</option>
            </select>
        </div>

        <div class="products-grid" id="productsGrid">
            <p class="loading">Загрузка товаров из базы данных...</p>
        </div>
    </div>

   
    <div class="card">
        <h2>2. Оформить заказ (Запись в таблицу 'orders')</h2>
        <form id="orderForm" onsubmit="submitOrder(event)">
            <div class="form-group">
                <label>User ID (из таблицы users):</label>
                <input type="number" readonly name="user_id" value="1" required>
            </div>
            <div class="form-group">
                <label>Total Amount(KzT):</label>
                <input type="number" name="total_amount" readonly value="1200" required>
            </div>
            <button type="button" onclick="submitOrder()">Оформить заказ (Insert)</button>
            <div id="order-status-msg" style="margin-top: 10px; font-weight: bold;"></div>
        </form>
    </div>
</div>
<!-- 3. Блок корзины -->
    <div class="card" style="margin-top: 20px;">
        <h2>3. Корзина покупок</h2>
        <div id="cartItems">
            <p>Корзина пуста</p>
        </div>
        <div id="cartTotal" style="font-weight: bold; margin-top: 10px; font-size: 1.1em; color: #0056b3;">
            Итого: ₸ 0
        </div>
    </div>
<div class="delivery-section" style="margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 8px;">
    <h3>Выбор локации доставки в AITU</h3>
    <select id="locationSelect" style="padding: 8px; width: 100%; max-width: 350px;">
        <option value="">Загрузка локаций...</option>
    </select>
</div>
<div id="order-status" style="margin-top: 10px; font-weight: bold; color: green;"></div>
<div id="productsGrid"></div>
<script src="script.js"></script>
</body>
</html>
